version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      python-deps: { patterns: ["*"] }
    ignore:
      # langchain-mcp-adapters still requires mcp<2 (ADR 0007); lift when it supports mcp 2.x.
      - dependency-name: "mcp"
        versions: [">=2"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule: { interval: "weekly" }
    ignore:
      # We run Python 3.12 everywhere (image, CI, local). Take patch updates only; a minor or
      # major bump is a deliberate change (pyproject.toml, CI and the image together).
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly" }
    groups:
      frontend-deps: { patterns: ["*"] }
    ignore:
      # CI and .nvmrc use Node 22 LTS; keep the Node typings in step with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet (the lint step fails); lift when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
