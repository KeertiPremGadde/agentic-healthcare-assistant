version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      python-deps: { patterns: ["*"] }
    ignore:
      # langchain-mcp-adapters still requires mcp<2 (ADR 0007); lift when it supports mcp 2.x.
      - dependency-name: "mcp"
        versions: [">=2"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule: { interval: "weekly" }
    ignore:
      # The project supports Python >=3.12,<3.14 (pyproject.toml); don't bump the image past it.
      - dependency-name: "python"
        versions: [">=3.14"]
  # Phase 6: add an "npm" entry for /frontend once package.json exists
