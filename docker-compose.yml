# Local development stack.  Start: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: medagent-db
    environment:
      POSTGRES_USER: medagent
      POSTGRES_PASSWORD: medagent
      POSTGRES_DB: medagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: medagent-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://medagent:medagent@db:5432/medagent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]   # `docker compose --profile full up` to run the API in Docker too

volumes:
  pgdata:
