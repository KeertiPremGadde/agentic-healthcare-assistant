# The eval tooling lives in its own environment and lock file, so ragas and deepeval (which pin
# older click, rich, jiter and fsspec) cannot pull the application's dependencies down.
#
#   uv sync --project evals
#   uv run --project evals python scripts/run_evals.py judge-rag --source ...
#
# Everything that does not call ragas/deepeval (retrieval, routing, rag, booking, gate) also runs
# in the normal project environment.
[project]
name = "medagent-evals"
version = "0.0.0"
description = "Isolated environment for the ragas / DeepEval judged metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "medagent",
    "ragas==0.4.3",
    "deepeval==4.3.2",
]

[tool.uv]
package = false

[tool.uv.sources]
medagent = { path = "..", editable = true }
