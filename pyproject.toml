[project]
name = "medagent"
version = "0.1.0"
description = "MedAgent: agentic AI healthcare assistant (LangGraph multi-agent, RAG, MCP, human-in-the-loop booking)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Keerti Prem Gadde" }]
requires-python = ">=3.12,<3.14"
# Phase 0 keeps only what the skeleton needs. Each phase adds its own deps (see docs/PLAN.md).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "pgvector>=0.5.1",
    "tzdata>=2026.6",
    "faker>=40.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medagent"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

# ---------------- Mypy ----------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker services (Postgres)",
    "llm: calls a real LLM API (skipped in CI by default)",
]

[tool.coverage.run]
source = ["src/medagent"]
