[project]
name = "medagent"
version = "0.1.0"
description = "MedAgent: agentic AI healthcare assistant (LangGraph multi-agent, RAG, MCP, human-in-the-loop booking)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Keerti Prem Gadde" }]
requires-python = ">=3.12,<3.14"
# Phase 0 keeps only what the skeleton needs. Each phase adds its own deps (see docs/PLAN.md).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "pgvector>=0.5.1",
    "tzdata>=2026.6",
    "faker>=40.44.0",
    "langchain-core>=1.7.3",
    "langchain-anthropic>=1.7.7",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.4",
    "fastembed>=0.9.1",
    "defusedxml>=0.7.1",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp[cli]>=1.30,<2",
    "langchain-mcp-adapters>=0.3.2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.33",
    "holidays>=0.107",
    "langfuse>=5.1.0,<6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "pre-commit>=4.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261030",
]
evals = [
    "deepeval==4.3.2",
    "ragas==0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medagent"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# An HTML/JS page embedded in a string: long lines are inherent.
"src/medagent/api/routes/demo.py" = ["E501"]

# ---------------- Mypy ----------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# google-api-python-client ships no type information
module = ["googleapiclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `evals` dependency group (large, untyped): treated as Any whether installed or not,
# so mypy gives the same answer locally and in CI, where the group is not installed.
module = ["ragas.*", "deepeval.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# deepeval (optional `evals` group) ships a pytest plugin that loads .env into the process
# environment, which would put real API keys into unit tests; keep it off.
addopts = "-ra --strict-markers -p no:deepeval"
markers = [
    "integration: needs Docker services (Postgres)",
    "llm: calls a real LLM API (skipped in CI by default)",
]

[tool.coverage.run]
source = ["src/medagent"]
